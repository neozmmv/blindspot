name: blindspot Room Test (Tor)

# End-to-end test of the serverless room path: two peers derive the same onion
# address from a name and password, one hosts it, the other finds it over Tor,
# and they exchange messages directly.
#
# Manual only, on purpose. It depends on the live Tor network, where bootstrap
# and descriptor publication were measured anywhere from ~28s to ~187s for the
# same code, with worse outliers. Gating pull requests on that would fail builds
# for reasons that have nothing to do with the change under review. Run it
# before releases, and after anything that touches discovery.

on:
  workflow_dispatch:

jobs:
  room-chat:
    name: "two peers over a Tor room"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'

      # Linux releases bundle no tor binary (the Tor Project publishes no
      # linux-aarch64 Expert Bundle), so blindspot falls back to one on PATH —
      # which is what the install script sets up and what this installs.
      - name: Install Tor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tor
          tor --version | head -1

      - name: Build
        run: go build -o blindspot .

      - name: Two peers over a Tor room
        run: .github/scripts/room-chat-e2e.sh ./blindspot
